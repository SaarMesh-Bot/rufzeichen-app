name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew ausführbar machen
        run: chmod +x ./gradlew

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug --stacktrace

      - name: Release-AAB (App Bundle) bauen
        run: ./gradlew bundleRelease --stacktrace

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: rufzeichen-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: AAB als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: rufzeichen-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Release veröffentlichen (nur bei Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
